page_name: "Katars & Knuckles"
page_description: "Hand-to-hand weapons: katars and knuckledusters, swung with the Hand to Hand skill."

# The banner's group and its one row, both nameless: the picture is all there is to them.
banner: ""

settings_group: "Hand-to-Hand Weapons"
settings_group_description: |-
  How katars, knuckledusters and other hybrid weapons behave. These are shared by every actor, so
  they live in the save rather than in your settings file.

strength_influences: "Factor Strength into Hand-to-Hand Combat"
strength_influences_description: |-
  Mirror of the launcher option of the same name (Settings -> Gameplay). No script can read the real
  one, so set this to match it, or the fatigue damage these weapons deal will not agree with a bare
  fist.

off: "Off"
on: "Affect Werewolves"
onExceptWerewolves: "Do Not Affect Werewolves"

# The weapon type line names a hybrid weapon by its two skills: "Hand-to-hand (Short Blade)".
tooltip_type: "%{primarySkill} (%{secondarySkill})"
tooltip_fatigue: "Fatigue Damage"
# The footnote of a hybrid weapon whose definition has no tooltip of its own, by its scaling. The
# placeholders are the ones a definition's tooltip can use (README.md); the numbers are the player's
# current values, filled in each time a tooltip is built.
tooltip_minor_secondary_bonus: "Hybrid weapon: effectiveness is determined by the %{primarySkill} skill (%{primary}), with a minor bonus from %{secondarySkill} (%{bonus})."
tooltip_lowest_skill: "Hybrid weapon: trains %{primarySkill} and %{secondarySkill}, and is only as effective as the lower of the two (%{effective})."
tooltip_highest_skill: "Hybrid weapon: trains %{primarySkill} and %{secondarySkill}, and is as effective as the higher of the two (%{effective})."

# The uniques. %{...} placeholders are filled from scripts/uniques.lua, so the numbers stay true.
# The name the charge goes by in the active effects list; %{spell} is the spell it holds.
fury_active: "Mage Fury: %{spell}"

# Bound Fist's scaling: what was found at load, shown read-only on the settings page.
status_group: "Bound Fist"
status_group_description: |-
  Bound Fist scales with Conjuration the way Unofficial TR Spells scales its bound weapons, from that
  mod's own settings (Scripts -> Unofficial TR Spells -> Bound Item Behaviour). This mod has no
  scaling settings of its own. Without Unofficial TR Spells, its defaults are used, and scaling is on.
bound_scaling: "Bound item scaling"
bound_scaling_description: "Where Bound Fist takes its scaling from. Changes in Unofficial TR Spells' settings apply to the next cast."
bound_scaling_tr_on: "From Unofficial TR Spells: on"
bound_scaling_tr_off: "From Unofficial TR Spells: off"
bound_scaling_default: "Unofficial TR Spells not installed: defaults, on"
