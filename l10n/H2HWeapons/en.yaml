page_name: "Katars and Knuckledusters"
page_description: "Hand-to-hand weapons: katars and knuckledusters, swung with the Hand to Hand skill."

settings_group: "Hand-to-Hand Weapons"
settings_group_description: |-
  How katars and knuckledusters behave. These are shared by every actor, so they live in the save
  rather than in your settings file.

strength_influences: "Strength influences hand to hand"
strength_influences_description: |-
  Mirror of the launcher option of the same name (Advanced -> Combat). No script can read the real
  one, so set this to match it, or the fatigue damage these weapons deal will not agree with a bare
  fist.

off: "Off"
on: "On"
onExceptWerewolves: "On, except werewolves"

hand_to_hand_share: "Hand to Hand experience share"
hand_to_hand_share_description: |-
  How much of a successful hit's experience goes to Hand to Hand. The rest goes to the weapon skill
  the engine thinks was used - Short Blade for katars, Blunt Weapon for knuckledusters.

skill_bonus_max: "Weapon skill bonus"
skill_bonus_max_description: |-
  What the weapon skill adds to your effective Hand to Hand, as a share of the weapon skill itself.
  0.15 is +15% of your Short Blade or Blunt Weapon.

skill_bonus_min: "Weapon skill bonus floor"
skill_bonus_min_description: |-
  The share a badly neglected weapon skill is still worth. The bonus tapers to this rather than
  disappearing.

skill_bonus_grace: "Weapon skill bonus grace"
skill_bonus_grace_description: |-
  How many points the weapon skill may fall behind Hand to Hand before the bonus starts tapering.
  Within this, or ahead, you get the full share.

skill_bonus_falloff: "Weapon skill bonus falloff"
skill_bonus_falloff_description: |-
  How many points past the grace the bonus takes to taper from the full share down to the floor.

show_off_hand_weapon: "Show the off-hand weapon"
show_off_hand_weapon_description: |-
  Put a second copy of the weapon in the left hand. Needs this mod's skeleton meshes, which add the
  bone it hangs off; turn this off if another mod replaces them.

silence_draw_sound: "Silence the draw and sheathe sound"
silence_draw_sound_description: |-
  These are officially short blades and blunt weapons, so the engine plays their draw and sheathe
  sound. Bare hands make none, and neither should these.

tooltip_type: "Hand to Hand"
tooltip_fatigue: "Fatigue Damage"
# %{skill} is Short Blade or Blunt Weapon, whichever the weapon is; %{handToHand} and %{bonus} are
# the player's current values, filled in each time a tooltip is built.
tooltip_explanation: "Hand-to-Hand weapon: effectiveness is determined by the Hand to Hand skill (%{handToHand}), with a minor bonus from %{skill} (%{bonus})."
